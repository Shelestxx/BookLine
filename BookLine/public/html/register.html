<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація | BookLine</title>
  <link rel="stylesheet" href="/css/register.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h2>Створити акаунт</h2>

      <form id="registerForm">
        <label for="name">Ім’я (Логін)</label>
        <input type="text" id="name" placeholder="Введіть ім’я" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Введіть email" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="Введіть пароль" required>

        <label for="confirm">Підтвердіть пароль</label>
        <input type="password" id="confirm" placeholder="Повторіть пароль" required>

        <button type="submit" class="btn">Зареєструватися</button>
      </form>

      <p class="switch">
        Вже маєте акаунт?
        <a href="login.html">Увійти</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // Зупиняємо перезавантаження сторінки

      const username = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      // 1. Перевірка паролів на клієнті
      if (password !== confirm) {
        alert("Паролі не співпадають!");
        return;
      }

      try {
        // 2. Відправка запиту на сервер
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();

        if (res.ok) {
          alert("Реєстрація успішна! Тепер увійдіть.");
          window.location.href = 'login.html'; // Перекидаємо на вхід
        } else {
          alert("Помилка: " + (data.message || data.error));
        }
      } catch (err) {
        console.error(err);
        alert("Помилка з'єднання з сервером");
      }
    });
  </script>
</body>
</html>
